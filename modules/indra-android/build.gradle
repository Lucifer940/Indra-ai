/*
 * indra-android - INDRA AI for Android phones.
 * Java + Android SDK (Views). Creator: Umesh Chaudhary.
 */
plugins {
    id 'com.android.application'
}

// Release signing: CI (or a developer) provides a keystore through environment
// variables. Without them the release build is simply unsigned - no secret is ever
// committed to the repository.
def releaseStore = System.getenv('INDRA_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('INDRA_KEYSTORE_PASSWORD')
def releaseAlias = System.getenv('INDRA_KEY_ALIAS')
def releaseKeyPassword = System.getenv('INDRA_KEY_PASSWORD')
def hasReleaseSigning = releaseStore && new File(releaseStore).exists()
        && releaseStorePassword && releaseAlias && releaseKeyPassword

android {
    namespace 'ai.indra.android'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.indra.android'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.2.0'
        resourceConfigurations += ['en', 'ne']
        // The app now talks to the backend embedded in the phone (127.0.0.1, port
        // chosen at runtime). This value is only the fallback for a remote server.
        buildConfigField 'String', 'API_BASE_URL', '"http://127.0.0.1:8420"'
        buildConfigField 'String', 'OAUTH_REDIRECT', '"indraai://oauth2redirect"'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // The embedded backend, crypto and JSON layers are used directly (no
            // reflection), so shrinking is disabled until it can be verified on a
            // device. A working release build beats a smaller broken one.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':indra-core')
    // The very same backend that runs on a PC, embedded in the app and bound to
    // 127.0.0.1. No Java runtime or external server is needed on the phone.
    implementation project(':indra-backend')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity:1.8.2'

    // Google sign-in is performed through the backend OAuth flow (AppAuth-style
    // PKCE with a Custom Tab), so no Play Services dependency is required.
    // If you prefer the native SDK, add:
    //   implementation 'com.google.android.gms:play-services-auth:20.7.0'
    testImplementation 'junit:junit:4.13.2'
}
