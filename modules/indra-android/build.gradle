/*
 * indra-android - INDRA AI for Android phones.
 * Java + Android SDK (Views). Creator: Umesh Chaudhary.
 */
plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.indra.android'
    compileSdk 34

    defaultConfig {
        applicationId 'ai.indra.android'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        resourceConfigurations += ['en', 'ne']
        // Default backend address. 10.0.2.2 is the host machine from the emulator;
        // users can change it at runtime in Settings → Connection.
        buildConfigField 'String', 'API_BASE_URL', '"http://10.0.2.2:8420"'
        buildConfigField 'String', 'OAUTH_REDIRECT', '"indraai://oauth2redirect"'
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES']
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation project(':indra-core')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity:1.8.2'

    // Google sign-in is performed through the backend OAuth flow (AppAuth-style
    // PKCE with a Custom Tab), so no Play Services dependency is required.
    // If you prefer the native SDK, add:
    //   implementation 'com.google.android.gms:play-services-auth:20.7.0'
    testImplementation 'junit:junit:4.13.2'
}
