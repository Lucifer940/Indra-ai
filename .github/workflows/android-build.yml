# INDRA AI - build the Android debug APK on every push.
# The APK is published as a workflow artifact, so no local Android SDK is needed
# to obtain an installable build.
name: Android build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
    -Dorg.gradle.parallel=true

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 34, build-tools and platform-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Show toolchain versions
        run: |
          chmod +x gradlew
          ./gradlew --version
          java -version

      - name: Assemble debug APK
        run: ./gradlew :indra-android:assembleDebug -Pandroid --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find modules/indra-android/build/outputs/apk/debug -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::Gradle finished but produced no APK"
            exit 1
          fi
          echo "APK: $APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          # Sanity-check that it is a real Android package and not an empty archive.
          unzip -l "$APK" | grep -q "classes.dex" || { echo "::error::APK has no classes.dex"; exit 1; }
          unzip -l "$APK" | grep -q "AndroidManifest.xml" || { echo "::error::APK has no manifest"; exit 1; }
          unzip -l "$APK" | grep -q "res/" || { echo "::error::APK has no resources"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: indra-ai-debug-apk
          path: |
            modules/indra-android/build/outputs/apk/debug/*.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            modules/indra-android/build/reports/**
            modules/indra-android/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Core and backend tests (informational)
    # The APK job above is the release gate. Tests are reported but do not block
    # the build, so a failing test never hides a buildable app.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Run unit and integration tests
        run: |
          chmod +x gradlew
          ./gradlew :indra-core:test :indra-backend:test --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            modules/indra-core/build/reports/tests/**
            modules/indra-backend/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
